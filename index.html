<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراجعة الرياضيات - أ. تغريد</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>مراجعة الرياضيات - الصف الرابع</h1>
            <input type="text" id="studentName" placeholder="اكتب اسمك هنا يا بطل...">
            <div class="progress-container"><div id="progressBar"></div></div>
        </header>

        <div id="lessonMenu" style="text-align:center; margin-top:20px;">
            <h3>اختر درساً للبدء:</h3>
            <button class="btn-next" onclick="startLesson('division')">القسمة</button>
            <button class="btn-next" onclick="startLesson('geometry')">الهندسة</button>
            <button class="btn-next" onclick="startLesson('fractions')">الكسور</button>
        </div>

        <div id="quizArea" style="display:none;">
            <div id="questionContainer"></div>
            <div id="optionsContainer"></div>
            <div id="feedback"></div>
            <div class="nav-buttons">
                <button id="nextBtn" class="btn-next">السؤال التالي</button>
            </div>
        </div>
        
        <div id="numbersGrid" class="numbers-grid"></div>
    </div>

    <script src="division.js"></script>
    <script src="geometry.js"></script>
    <script src="fractions.js"></script>
    <script src="main.js"></script>
</body>
</html>
